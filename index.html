<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Point Model</title>
<meta name="theme-color" content="#0F2038" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1424" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Point Model">
<style>
:root {
  --bg: #EEF1F5; --panel: #FFFFFF; --ink: #101B2B; --muted: #5A6778; --rule: #DDE3EA; --wash: #F4F6F9;
  --band: #0F2038; --bandrule: #0F2038; --bandink: #F2F5F9; --bandmuted: #9FB0C6; --accent: #5BD593;
  --model: #1F5FBF; --market: #6B7787; --flag: #8A4B00; --flagbg: #FBEBD0;
  --good: #1B7A47; --bad: #B23A32;
  --vbet: #17855B; --vbetink: #FFFFFF; --vlean: #BFE6D2; --vleanink: #0B4A32;
  --vnone: #EDF0F4; --vnoneink: #5A6778; --vchk: #073826; --vchkink: #FFFFFF;
  --sbet: #17855B; --slean: #8FD0B0; --snone: #DDE3EA; --wtint: rgba(27,122,71,.12); --ltint: rgba(178,58,50,.12);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B1220; --panel: #121B2C; --ink: #E8EEF6; --muted: #97A5B8; --rule: #24324A; --wash: #0F1828;
    --band: #0A1424; --bandrule: #1C2A42; --bandink: #F2F5F9; --bandmuted: #8FA1B8;
    --model: #7FB0F5; --market: #9AA7B8; --flag: #F0B35E; --flagbg: #3A2A0E;
    --good: #5FC28B; --bad: #F08A80;
    --vbet: #2FA876; --vbetink: #04281A; --vlean: #1F3D31; --vleanink: #A9E3C6;
    --vnone: #1C2636; --vnoneink: #97A5B8; --vchk: #0C5A3C; --vchkink: #FFFFFF;
    --sbet: #2FA876; --slean: #2B6650; --snone: #2A3648; --wtint: rgba(95,194,139,.16); --ltint: rgba(240,138,128,.16);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--sans); margin: 0; }
h1 { font-size: 25px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 19px; line-height: 1.25; font-weight: 700; letter-spacing: -0.005em; margin-bottom: 4px; }
h3 { font-size: 14.5px; font-weight: 600; }
.band { background: var(--band); color: var(--bandink); border-bottom: 1px solid var(--bandrule); }
.inner { max-width: 1240px; margin: 0 auto; padding: 18px 20px 0; }
.brand { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.brand svg { flex: none; }
.tag { margin: 2px 0 0; color: var(--bandmuted); font-size: 13.5px; }
.meta { margin: 0 0 0 auto; color: var(--bandmuted); font-size: 13px; text-align: right; }
nav { display: flex; gap: 4px; margin-top: 14px; }
nav button { font: inherit; font-size: 14.5px; background: none; border: 0; color: var(--bandmuted); padding: 9px 14px 11px;
  cursor: pointer; border-bottom: 3px solid transparent; display: flex; gap: 7px; align-items: center; }
nav button:hover { color: var(--bandink); }
nav button svg { display: none; }
nav button[aria-current="page"] { color: var(--bandink); border-bottom-color: var(--accent); font-weight: 600; }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
:focus-visible { outline: 2px solid var(--model); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 22px 20px 56px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-bottom: 14px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group > span { color: var(--muted); margin-right: 2px; font-size: 13.5px; }
.chip, select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 8px; padding: 5px 11px; cursor: pointer; }
select { padding: 6px 8px; }
.chip:hover:not(:disabled) { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chip:disabled { opacity: .4; cursor: default; }
input[type="search"] { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 8px; padding: 6px 11px; width: 170px; }
.keys { display: flex; flex-wrap: wrap; gap: 8px 38px; margin: 0 0 14px; padding: 0; }
.keys dt { font-size: 12.5px; color: var(--muted); }
.keys dd { margin: 0; font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
.legend svg { vertical-align: -3px; margin-right: 5px; }
@media (max-width: 600px) { .pc { display: none; } }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 10px 12px 10px 0;
  background: var(--wash); border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.panel th:first-child, .panel td:first-child { padding-left: 16px; }
.panel th:last-child, .panel td:last-child { padding-right: 16px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--wash); }
.num { text-align: right; padding-right: 14px; white-space: nowrap; }
th.num { padding-right: 14px; }
.game { font-weight: 600; }
.game small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.scale { display: flex; justify-content: space-between; font-weight: 400; font-size: 12px; color: var(--muted); }
.bell { display: block; width: 220px; height: 28px; }
.bell .turf { fill: var(--wash); stroke: var(--rule); stroke-width: 1; }
.bell .tick { stroke: var(--rule); stroke-width: 1.5; }
.bell .mid { stroke: var(--muted); stroke-width: 1.5; opacity: .55; }
.bell .link { stroke: var(--model); stroke-width: 2.5; opacity: .5; }
.bell .mk { fill: var(--panel); stroke: var(--market); stroke-width: 2.5; }
.bell .md { fill: var(--model); stroke: var(--panel); stroke-width: 2; }
.nw, .txt { white-space: nowrap; }
.txt { padding-right: 14px; }
.cards td.strip, .cards th.stripth { padding-right: 18px; }
.game { min-width: 170px; max-width: 230px; }
.tl { font-size: 13px; margin-top: 2px; }
.flag { display: block; width: fit-content; margin: 3px 0 0; padding: 1px 8px; border-radius: 4px; font-size: 12.5px;
  color: var(--flag); background: var(--flagbg); font-weight: 600; white-space: nowrap; }
.vc { box-sizing: border-box; width: 232px; height: 56px; margin-left: 0; padding: 0 0 0 12px; border-left: 5px solid transparent; border-radius: 0;
  display: flex; flex-direction: column; justify-content: center; }
.vc .vh > span:first-child { display: flex; min-width: 0; overflow: hidden; }
.vc .vh .pv, .vc .vh .pn { flex: none; }
.vc .vh .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.vc .vh { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; line-height: 22px; white-space: nowrap; }
.vc .vl { font-size: 13px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vc .vl.soft { opacity: .85; }
.vc .tl { margin: 0; }
.vc .muted { color: inherit; opacity: .85; }
.vc.rw { background: var(--wtint); }
.vc.rl { background: var(--ltint); }
.vc .chipres { font-weight: 700; }
.vc.vbet { border-left-color: var(--sbet); color: var(--ink); font-weight: 700; }
.vc.vlean { border-left-color: var(--slean); color: var(--ink); font-weight: 600; }
.vc.vnone { border-left-color: var(--snone); color: var(--muted); font-weight: 400; }
.vc .vh { font-weight: inherit; }
.vf { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor;
  font-size: 11.5px; font-weight: 600; line-height: 18px; white-space: nowrap; }
.vf.sm { padding: 0 6px; font-size: 11px; line-height: 16px; gap: 3px; }
.vc .vl.fl { display: flex; align-items: center; gap: 8px; overflow: visible; }
.ft { display: block; font-size: 12.5px; line-height: 18px; color: var(--muted); max-width: 130px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.fn { display: block; font-size: 18px; line-height: 24px; font-weight: 600; }
.cards tbody tr { height: 84px; }
.sw { display: inline-block; width: 13px; height: 13px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
.sw.vbet { background: var(--sbet); }
.sw.vlean { background: var(--slean); }
.sw.vnone { background: var(--snone); }
.sw.vchk { background: var(--vchk); }
.gl, .tlk { color: inherit; text-decoration: none; }
.gl:hover, .tlk:hover { text-decoration: underline; }
.tlk { font-weight: 600; }
.gd { display: flex; flex-wrap: wrap; gap: 18px 36px; align-items: flex-start; margin: 4px 0 6px; }
.gd .gl2 { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.gd .vc, .gd .vc.tbx { margin-left: 0; }
.tiles { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 14px; align-items: stretch; }
.tile { flex: 1 1 150px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 18px; }
.tile .tk { font-size: 12.5px; color: var(--muted); }
.tile .tv { font-size: 24px; font-weight: 700; line-height: 32px; font-variant-numeric: tabular-nums; }
.tile .ts { font-size: 12.5px; color: var(--muted); }
.tile.pick { flex: 1 1 232px; display: flex; align-items: center; }
.tile.pick .vc { width: 100%; min-height: 44px; height: auto; }
.tile .vc { margin-left: 0; }
.split { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.split > .panel { flex: 1.4 1 320px; }
.split > .tile { flex: 1 1 260px; }
.hero { display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 24px; margin: 0 0 6px; }
.hero .big { font-size: 38px; font-weight: 700; line-height: 46px; font-variant-numeric: tabular-nums; }
.hero p { margin: 0; max-width: 56ch; line-height: 1.5; }
details.more { margin-top: 30px; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); }
details.more > summary { cursor: pointer; padding: 14px 20px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary span { color: var(--muted); font-weight: 400; font-size: 14px; }
details.more > .inner2 { padding: 0 20px 20px; }
.mobsort { display: none; }
table.ps .oc { display: none; }
.chg { font-variant-numeric: tabular-nums; white-space: nowrap; }
.chg.up { color: var(--good); }
.chg.dn { color: var(--bad); }
.cmp { padding: 16px 20px; margin: 0 0 16px; max-width: 860px; }
.cmp .cin { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
.cmp select { max-width: 100%; }
#tip { position: fixed; z-index: 60; max-width: 270px; background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.4; font-weight: 400;
  padding: 8px 11px; border-radius: 7px; pointer-events: none; opacity: 0; transition: opacity .12s; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
#tip.on { opacity: 1; }
[data-tip] { cursor: help; }
th[data-tip] { text-decoration: underline dotted var(--rule); text-underline-offset: 4px; }
.hsort[data-tip] { text-decoration: underline dotted var(--rule); text-underline-offset: 4px; }
.lgsw { display: inline-flex; border: 1px solid rgba(255,255,255,.28); border-radius: 9px; overflow: hidden; margin: 10px 0 0; }
.lgsw button { font: inherit; font-size: 13.5px; font-weight: 600; color: #C9D4E4; background: transparent; border: 0; padding: 6px 16px; cursor: pointer; }
.lgsw button[aria-pressed="true"] { background: #F3F5F1; color: #0F2038; }
.cf { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.cfline { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.cmp .cout { margin-top: 14px; }
.cmp .big { font-size: 22px; font-weight: 700; }
.spark { width: 100%; max-width: 720px; height: auto; display: block; }
.spark .ln { fill: none; stroke: var(--model); stroke-width: 2.2; }
.spark .dt { fill: var(--model); }
.spark .zero { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.spark text { font-size: 11px; fill: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13.5px; font-weight: 600; color: var(--muted); background: var(--panel); border: 0; padding: 6px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.muted { color: var(--muted); }
.count { color: var(--muted); font-size: 13.5px; margin: 10px 0 0; }
.empty { padding: 28px 0; max-width: 60ch; }
.verdict { font-size: 17px; line-height: 1.45; max-width: 66ch; margin: 0 0 6px; }
.block { margin-top: 34px; }
.block:first-child, .verdict + .block { margin-top: 26px; }
.block > p { margin: 2px 0 14px; color: var(--muted); max-width: 70ch; }
.miss { display: grid; grid-template-columns: 70px 1fr 56px; gap: 6px 10px; align-items: center; max-width: 560px; margin-bottom: 18px; }
.miss .bar { height: 12px; border-radius: 0 4px 4px 0; }
.miss .bar.model { background: var(--model); }
.miss .bar.market { background: var(--market); }
.miss .val { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 56px; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.rate svg, .units svg { display: block; width: 100%; max-width: 380px; height: auto; }
.rate .t, .units .t { fill: var(--muted); font: 11.5px var(--sans); }
.units .tv { fill: var(--ink); font: 600 11.5px var(--sans); }
.rate .ax, .units .ax { stroke: var(--rule); stroke-width: 1.5; }
.rate .be { stroke: var(--flag); stroke-width: 1.5; stroke-dasharray: 3 3; }
.rate .wh { stroke: var(--model); stroke-width: 2.5; }
.rate .dot { fill: var(--model); stroke: var(--bg); stroke-width: 2; }
.units .up { fill: var(--good); }
.units .dn { fill: var(--bad); }
.rate p, .units p { margin: 4px 0 0; font-size: 14px; }
.chipres { font-weight: 600; white-space: nowrap; }
.chipres.W { color: var(--good); }
.chipres.L { color: var(--bad); }
.chipres.P { color: var(--muted); }
.hsort { font: inherit; font-weight: 600; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.hsort:hover { color: var(--ink); }
.hsort .arr { display: inline-block; min-width: 1.1em; font-size: 10px; }
.nb { position: relative; height: 10px; width: 150px; background: var(--wash); border-radius: 5px; }
.nb::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5; }
.nb i { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.nb i.pos { background: var(--model); }
.nb i.neg { background: var(--market); }
.guide { max-width: 72ch; }
.guide h2 { margin-top: 28px; }
.guide h2:first-child { margin-top: 0; }
.guide ul { padding-left: 20px; }
.foot { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 13.5px; max-width: 76ch; }
.sr { position: absolute; left: -9999px; }
@media (max-width: 700px) {
  h1 { font-size: 21px; }
  .meta { margin: 0 0 0 54px; text-align: left; flex-basis: 100%; }
  .inner { padding: 16px 14px 16px; }
  .wrap { padding: 18px 14px 96px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; margin: 0; gap: 0; background: var(--panel);
    border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; flex-direction: column; gap: 2px; justify-content: center; align-items: center; font-size: 12px;
    padding: 8px 0; border-bottom: 0; border-top: 3px solid transparent; color: var(--muted); }
  nav button:hover { color: var(--ink); }
  nav button svg { display: block; }
  nav button[aria-current="page"] { color: var(--ink); border-top-color: var(--model); border-bottom-color: transparent; }
  input[type="search"] { width: 100%; }
  .toolbar { gap: 8px; margin-bottom: 10px; }
  .toolbar .group { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; scrollbar-width: none; }
  .toolbar .group::-webkit-scrollbar { display: none; }
  .toolbar .chip, .toolbar select, .toolbar .group > span { flex: none; white-space: nowrap; }
  .legend span:last-child { display: none; }
  details.more > summary span { display: none; }
  #rtable th:last-child, #rtable td:last-child { display: none; }
  .mobsort { display: inline-block; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
  .cards table, .cards tbody { display: block; }
  .cards thead { display: none; }
  .cards tbody tr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
  .cards tbody tr:last-child { border-bottom: 0; }
  .cards td { display: block; border: 0; padding: 0 !important; text-align: left; }
  .cards td[data-l]::before { content: attr(data-l); display: block; font-size: 12px; color: var(--muted); }
  .cards td.game, .cards td.strip { grid-column: 1 / -1; }
  .cards td.lean, .cards td.tot { grid-column: 1 / -1; }
  .cards .bell { width: 100%; height: auto; }
  .cards tbody tr { height: auto; }
  .vc, .vc.tbx { width: 100%; margin-left: 0; }
  .vc.tbx { height: auto; min-height: 48px; padding-top: 6px; padding-bottom: 6px; }
}
</style>
</head>
<body>
<header class="band"><div class="inner">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#17304F"/><line x1="20" y1="11" x2="20" y2="29" stroke="#5A6C86" stroke-width="1.5"/><line x1="13" y1="20" x2="27" y2="20" stroke="#7FAEEA" stroke-width="2"/><circle cx="12" cy="20" r="4.5" fill="none" stroke="#F3F5F1" stroke-width="2.2"/><circle cx="28" cy="20" r="5" fill="#7FAEEA"/></svg>
    <div><h1 id="ttl">CFB Point Model</h1><p class="tag" id="tagl">College football: our model vs the betting line</p></div><p class="meta" id="sub"></p>
  </div>
  <div class="lgsw" id="lgsw" role="group" aria-label="League"></div>
  <nav id="nav" aria-label="Sections"></nav>
</div></header>
<div class="wrap">
  <main id="main"></main>
  <p class="foot" id="foot"></p>

  var h = '<div class="big">' + (am < 0.5 ? "Pick'em" : esc(fav) + " by " + f1(am)) + '</div><div class="muted" style="margin:2px 0 12px">' + where +
    (am >= 0.5 ? ". Spread: " + esc(fav) + " \u2212" + half(am) : "") + "</div>";
  h += '<table><thead><tr><th></th><th class="num">' + esc(cmpA) + '</th><th class="num">' + esc(cmpB) + '</th><th class="num">Difference</th></tr></thead><tbody>';
  [["Net", "net"], ["Offense", "off"], ["Defense", "def"]].forEach(function (x) {
    var d = A[x[1]] - B[x[1]];
    h += "<tr><td>" + x[0] + '</td><td class="num">' + sgn(A[x[1]]) + '</td><td class="num">' + sgn(B[x[1]]) + '</td><td class="num"><b>' + sgn(d) + "</b></td></tr>";
  });
  out.innerHTML = h + "</tbody></table>";
}
function confList() {
  var m = {};
  D.ratings.forEach(function (r) { if (r.conf) { (m[r.conf] = m[r.conf] || []).push(r); } });
  return Object.keys(m).map(function (c) {
    var v = m[c].map(function (r) { return r.net; }).filter(function (x) { return x !== null && x !== undefined; });
    return { name: c, n: m[c].length, avg: v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : 0 };
  }).sort(function (a, b) { return b.avg - a.avg; });
}
function confSelect() {
  var cl = confList();
  if (!cl.length) return "";
  return '<select id="rconf" aria-label="Conference"><option value="">All teams</option>' + cl.map(function (c) {
    return '<option value="' + esc(c.name) + '"' + (c.name === rconf ? " selected" : "") + ">" + esc(c.name) + " (" + c.n + ")</option>";
  }).join("") + "</select>";
}
function buildRatings(el) {
  var R = D.ratings;
  if (!R.length) {
    el.innerHTML = '<div class="empty"><h2>No ratings yet</h2><p>The team ratings appear after the next scheduled run of the updated 09_predict.py.</p></div>';
    return;
  }
  var h = '<div class="block"><h2>Power Ratings</h2><p>Points better than ' + M.avg + ' on a neutral field' +
    (D.ratingsWeek !== null ? ", as used for the week " + D.ratingsWeek + " predictions" : "") +
    ". Net is the model's own rating, so the gap between two teams is the spread the model gives them" + (D.homeAdv ? " (home field adds about " + f1(D.homeAdv) + ")" : "") +
    ". Offense and defense are its two parts.</p></div>";
  var names = R.map(function (r) { return r.team; }).sort(function (a, b) { return a.localeCompare(b); });
  var opts = '<option value="">Choose a team</option>' + names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + "</option>"; }).join("");
  h += '<div class="panel cmp"><div style="font-weight:700;margin-bottom:8px">Compare two teams</div><div class="cin"><select id="ca" aria-label="First team">' + opts +
    '</select><span class="muted">vs</span><select id="cb" aria-label="Second team">' + opts + '</select><select id="cs" aria-label="Where"><option value="n">Neutral field</option><option value="a">First team at home</option><option value="b">Second team at home</option></select></div><div class="cout" id="cout"></div></div>';
  h += '<div class="toolbar"><div class="seg" id="rgroup">' + [["all", "Overall"], ["pass", "Pass"], ["rush", "Rush"]].map(function (s) {
      return '<button data-m="' + s[0] + '" aria-pressed="' + (s[0] === rmode) + '">' + s[1] + "</button>";
    }).join("") + '</div>' + confSelect() + '<input type="search" id="rq" placeholder="Find a team" aria-label="Find a team"></div><div class="cfline" id="cfline"></div><div id="cfodds"></div>';
  h += '<div class="panel" style="max-width:980px"><div class="scroll"><table id="rtable"><thead><tr><th class="num">' + hs("rank", "Rank") + "</th><th>" + hs("team", "Team") + '</th><th class="num">' + hs("net", "Net") + '</th><th class="num oc">' + hs("chg", "Change") + '</th><th class="num">' + hs("off", "Offense") + '</th><th class="num">' + hs("def", "Defense") + '</th><th class="num oc">' + hs("sos", "Schedule") + '</th><th tabindex="0" data-tip="' + esc(RTIPS.bar) + '">Strength</th></tr></thead><tbody id="rtb"></tbody></table></div></div>' +
    '<p class="count">Change is the move in Net since last week. Schedule is the average Net of the opponents played so far, so a higher number means a tougher schedule.</p>';
  el.innerHTML = h;
  var ca = document.getElementById("ca"), cb = document.getElementById("cb"), cs = document.getElementById("cs");
  ca.value = cmpA; cb.value = cmpB; cs.value = cmpSite;
  ca.addEventListener("change", function () { cmpA = ca.value; drawCompare(); });
  cb.addEventListener("change", function () { cmpB = cb.value; drawCompare(); });
  cs.addEventListener("change", function () { cmpSite = cs.value; drawCompare(); });
  drawCompare();
  document.getElementById("rgroup").addEventListener("click", function (e) {
    var m = e.target.getAttribute("data-m"); if (!m) return;
    rmode = m;
    drawRatings();
  });
  el.querySelector("#rtable thead").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".hsort") : null;
    if (!b) return;
    var k = b.getAttribute("data-h");
    if (k === rsort) rdir = rdir === "asc" ? "desc" : "asc";
    else { rsort = k; rdir = rdefault(k); }
    drawRatings();
  });
  document.getElementById("rq").addEventListener("input", drawRatings);
  var rc = document.getElementById("rconf");
  if (rc) rc.addEventListener("change", function () { rconf = rc.value; drawRatings(); });
  drawRatings();
}
function u1(v) { return v === null || v === undefined ? "-" : f1(v); }
function nbar(v, mx) {
  var w = Math.abs(v) / mx * 50;
  var left = v >= 0 ? 50 : 50 - w;
  return '<div class="nb" role="img" aria-label="Net ' + f1(v) + '"><i class="' + (v >= 0 ? "pos" : "neg") + '" style="left:' + left + '%;width:' + w + '%"></i></div>';
}
function pct(v) { return v === null || v === undefined ? "-" : v < 0.005 ? "<1%" : v > 0.995 ? ">99%" : Math.round(v * 100) + "%"; }
function drawOdds() {
  var el = document.getElementById("cfodds");
  if (!el) return;
  var C = (D.confOdds || {})[rconf];
  if (!rconf || !C) { el.innerHTML = ""; return; }
  var mx = Math.max.apply(null, C.teams.map(function (t) { return t.first || 0; }).concat([0.01]));
  var h = '<div class="panel" style="max-width:980px;margin:0 0 16px"><div style="padding:14px 16px 4px;font-weight:700">Who wins ' + esc(rconf) + '?</div><div class="scroll"><table><thead><tr><th>Team</th><th class="num" tabindex="0" data-tip="' + esc(M.recTip) + '">' + esc(M.recHead) + '</th><th class="num" tabindex="0" data-tip="Average final record across 10,000 simulated seasons.">Projected</th><th class="num" tabindex="0" data-tip="' + esc(M.firsttip) + '">' + esc(M.winHead) + '</th><th class="num oc" tabindex="0" data-tip="Share of simulated seasons where the team finishes first with no tie for the top spot.">Outright</th><th class="num" tabindex="0" data-tip="' + esc(M.top2tip) + '">' + esc(M.top2) + '</th><th></th></tr></thead><tbody>';
  C.teams.forEach(function (t) {
    h += "<tr><td><b>" + teamLink(t.team) + '</b></td><td class="num">' + t.w + "-" + t.l + '</td><td class="num">' + f1(t.ew) + "-" + f1(t.el) + '</td><td class="num"><b>' + pct(t.first) + '</b></td><td class="num oc">' + pct(t.out) + '</td><td class="num">' + pct(t.top2) +
      '</td><td style="min-width:90px"><div class="nb" role="img" aria-label="' + pct(t.first) + '"><i class="pos" style="left:0;width:' + ((t.first || 0) / mx * 100) + '%"></i></div></td></tr>';
  });
  h += "</tbody></table></div>";
  if (C.games.length) {
    h += '<div style="padding:4px 16px 14px"><div style="font-weight:600;margin:8px 0 6px">Games that matter most</div>';
    C.games.forEach(function (g) {
      var fav = g.p >= 0.5 ? g.h : g.a, fp = g.p >= 0.5 ? g.p : 1 - g.p;
      h += '<div style="margin:3px 0">Week ' + g.wk + ": " + esc(g.a) + " at " + esc(g.h) + ' <span class="muted">\u2014 ' + esc(fav) + " " + Math.round(fp * 100) + "% to win</span></div>";
    });
    h += "</div>";
  }
  h += '<p class="count" style="padding:0 16px 14px;margin:0">' + esc(M.oddsnote) + '</p></div>';
  el.innerHTML = h;
}
function drawRatings() {
  drawOdds();
  var q = document.getElementById("rq").value.trim().toLowerCase();
  var nz = function (v) { return v === null || v === undefined ? -1e9 : v; };
  var mx = Math.max.apply(null, D.ratings.map(function (r) { var v = rv(r, "net"); return v === null ? 0 : Math.abs(v); }).concat([1]));
  var ranked = D.ratings.slice().sort(function (a, b) { return nz(rv(b, "net")) - nz(rv(a, "net")); });
  var rank = {};
  ranked.forEach(function (r, i) { rank[r.team] = i + 1; });
  var list = D.ratings.filter(function (r) { return (!q || r.team.toLowerCase().indexOf(q) >= 0) && (!rconf || r.conf === rconf); });
  var cfl = document.getElementById("cfline");
  if (cfl) {
    var ci = confList().filter(function (c) { return c.name === rconf; })[0];
    if (ci) {
      var order = confList().map(function (c) { return c.name; });
      cfl.innerHTML = "<b>" + esc(ci.name) + "</b>: " + ci.n + " teams, average Net " + sgn(ci.avg) + ", " + ordinal(order.indexOf(ci.name) + 1) + " strongest of " + order.length + " " + M.groups + ". Rank is the overall rank.";
    } else cfl.innerHTML = "";
  }
  if (rmode !== "all" && (rsort === "chg" || rsort === "sos")) { rsort = "net"; rdir = "desc"; }
  list.sort(function (a, b) {
    var c;
    if (rsort === "team") c = a.team.localeCompare(b.team);
    else if (rsort === "rank") c = rank[a.team] - rank[b.team];
    else c = nz(rv(a, rsort)) - nz(rv(b, rsort));
    if (rsort !== "team" && rsort !== "rank") c = -c;   // numbers: biggest first by default
    return rdir === rdefault(rsort) ? c : -c;
  });
  document.getElementById("rtable").className = rmode === "all" ? "" : "ps";
  Array.prototype.forEach.call(document.querySelectorAll("#rgroup button"), function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-m") === rmode ? "true" : "false");
  });
  Array.prototype.forEach.call(document.querySelectorAll(".hsort[data-h]"), function (b) {
    b.setAttribute("data-tip", rtip(b.getAttribute("data-h")));
  });
  Array.prototype.forEach.call(document.querySelectorAll(".hsort"), function (b) {
    var on = b.getAttribute("data-h") === rsort;
    b.querySelector(".arr").textContent = on ? (rdir === "asc" ? " \u25B2" : " \u25BC") : "";
    b.parentNode.setAttribute("aria-sort", on ? (rdir === "asc" ? "ascending" : "descending") : "none");
  });
  document.getElementById("rtb").innerHTML = list.map(function (r) {
    var n = rv(r, "net");
    return '<tr><td class="num">' + rank[r.team] + "</td><td><b>" + teamLink(r.team) + '</b>' + (r.conf && !rconf ? '<span class="cf">' + esc(r.conf) + "</span>" : "") + '</td><td class="num"><b>' + u1(n) + '</b></td><td class="num oc">' + chgCell(r.chg) + '</td><td class="num">' +
      u1(rv(r, "off")) + '</td><td class="num">' + u1(rv(r, "def")) + '</td><td class="num oc">' + sgn(r.sos) + "</td><td>" + (n === null ? "" : nbar(n, mx)) + "</td></tr>";
  }).join("") || '<tr><td colspan="8" class="muted">No teams match.</td></tr>';
}

/* ---------- guide ---------- */
var CFB_TEST = "<p>Every layer we tried (efficiency ratings, preseason talent, rest, pace and run rate, weather, field position, finishing drives, turnovers and resume ratings) brought the model to within about half a point of the betting line and none beat it. The drive and resume layers helped a little, about a tenth of a point. The spread and totals markets already price in what public stats can see. The Season page keeps an honest record on real games, which is the only thing that can show an edge.</p>";
var NFL_TEST = "<p>We tested the NFL model against closing betting lines from 2020 through 2025, using only information that was available before each game. It missed by about a third of a point more per game than the line, which is normal: the NFL line is one of the sharpest in sports. Adding the starting quarterback helped a little, about a twentieth of a point, and weighting recent games, capping blowouts and adding weather did not help. Treat this model as a second opinion and a way to spot big disagreements, then check injuries. The Season page keeps an honest record on real games, which is the only thing that can show an edge.</p>";
function buildGuide(el) {
  el.innerHTML = '<div class="guide">' +
    "<h2>Reading the Games Page</h2>" +
    "<ul><li><b>Market and Model</b> are spreads for the favorite, so the same team name on both means they agree on who wins.</li>" +
    "<li><b>Spread pick</b> is the side the model likes more than the market. <b>Bet</b> is a gap of 4 or more points, <b>Lean</b> is 2 to 4, and <b>No bet</b> is under 2. The number is the market spread you would take.</li>" +
    "<li><b>Total pick</b> works the same way for the over/under, with the market total next to it.</li>" +
    "<li><b>QB</b> appears on a Lean or better when a team started a different quarterback last game than the game before. Check the news before betting those.</li>" +
    "<li>Tap a game to see its market, model and the pass and rush matchups. Tap a team on the Ratings tab to see its ratings and results.</li>" +
    (LG === "cfb" ? "<li>Be careful with Air Force, Army and Navy totals, since the model doesn't capture how option offenses burn the clock.</li>" : "<li>Check the injury report before betting. The model knows who is starting at quarterback but not about other injured players.</li>") + "</ul>" +
    "<h2>Reading the Ratings Tab</h2>" +
    "<ul><li><b>Net</b> is the model's own rating in points better than " + M.avg + ". Subtract one team's Net from another's and you get the spread the model gives them on a neutral field. Home field adds a few points.</li>" +
    "<li><b>Offense and Defense</b> are the two parts of Net." + (LG === "cfb" ? " Preseason talent and returning production are split evenly between them." : " The starting quarterback's rating is split evenly between them.") + "</li>" +
    "<li><b>Change</b> is the move in Net since last week, and <b>Schedule</b> is the average Net of the opponents played so far.</li>" +
    "<li>Use <b>Compare two teams</b> to see the model's spread for any matchup, even ones that are not scheduled.</li></ul>" +
    "<h2>What Testing Showed</h2>" +
    (LG === "cfb" ? CFB_TEST : NFL_TEST) +
    "<h2>When It Updates</h2>" +
    "<p>Your computer runs the update on a schedule (Monday morning and Thursday morning). Each run grades finished games and predicts the next week with the newest lines. Each game keeps its latest pre-game prediction. The page shows when it was last rebuilt at the top.</p>" +
    "<h2>Using It Like an App</h2>" +
    "<p>On a phone, open the page in your browser and choose Add to Home Screen. On a computer in Chrome or Edge, use the install icon in the address bar. It then opens in its own window like any other app.</p></div>";
}

parseHash();
render();
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function () {});
}
</script>
